<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>My Debit Diary Web</title>
<style>
  :root{
    --bg:#0a0e0b;
    --card:#2f443a;
    --card-2:#242824;
    --sheet:#39423c;
    --sheet-2:#2c352f;
    --line:#232a25;
    --text:#f2f5f2;
    --muted:#a7b3aa;
    --mint:#8fe3c8;
    --mint-btn:#83e2c0;
    --teal:#0b6e57;
    --teal-dark:#095a47;
    --danger:#ff8a7a;
    --exp-red:#f2766d;
    --inc-green:#7ed491;
    --chip-border:#5b6f61;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  button,select,input:not([type="checkbox"]){min-height:44px}

  .app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid #1c241e;display:flex;align-items:stretch;gap:2px;padding:0 6px}
  .topbar.hidden{display:none}
  .icon-btn{background:none;border:0;color:var(--text);width:46px;min-height:56px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .icon-btn svg{width:25px;height:25px;fill:var(--text)}
  .tabs{display:flex;flex:1;min-width:0}
  .tab{flex:1;background:none;border:0;color:#dfe7e0;font-size:19px;font-weight:500;padding:14px 1px 12px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:56px}
  .tab.active{color:var(--text);font-weight:700}
  .tab.active::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:3px;background:var(--mint);border-radius:3px 3px 0 0}

  main{flex:1;padding:14px 14px 110px}

  /* Date / period card */
  .date-card{background:var(--card);border-radius:8px;padding:16px 8px;display:flex;align-items:center;gap:4px}
  .nav-arrow{background:none;border:0;color:var(--text);font-size:30px;line-height:1;width:44px;height:52px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .date-main{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
  .day-num{font-size:44px;font-weight:400;line-height:1;padding-left:2px}
  .date-texts{min-width:0}
  .date-line1{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .date-line2{font-size:17px;color:#d7e0d8;margin-top:2px}
  .balance-box{text-align:right;padding-right:4px;flex:0 0 auto}
  .balance-label{font-size:17px;color:#d7e0d8}
  .balance-amt{font-size:18px;margin-top:3px;white-space:nowrap}

  .cf-row{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 12px;font-size:21px}
  .cf-row .amt{font-weight:500}

  .section-head{background:var(--card-2);display:flex;justify-content:space-between;align-items:center;padding:14px 14px;margin:8px -2px 0}
  .section-head h2{margin:0;font-size:21px;font-weight:700}
  .section-head .total{font-size:20px;font-weight:700;white-space:nowrap}
  .hint{color:var(--muted);font-size:17px;line-height:1.45;padding:18px 22px 8px;margin:0}

  .entry-list{list-style:none;margin:6px 0 4px;padding:0}
  .entry-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 8px;min-height:52px;color:var(--text);user-select:none;-webkit-user-select:none}
  .entry-item:active{background:#141a15}
  .entry-main{flex:1;min-width:0}
  .entry-text{font-size:17px;font-weight:500;overflow-wrap:anywhere}
  .entry-sub{font-size:13.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;display:block}
  .entry-amt{font-size:17px;font-weight:600;white-space:nowrap}
  .entry-amt.credit{color:var(--mint)}
  .entry-amt.debit{color:var(--danger)}

  /* Period selector row (Monthly / Yearly / Report) */
  .period-row{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
  .period-nav{flex:1;display:flex;align-items:center;justify-content:space-between;border:1.5px solid #39423c;border-radius:10px;padding:4px 8px;min-height:52px}
  .period-nav .nav-arrow{width:40px;height:44px;font-size:26px}
  .period-nav .period-label{font-size:20px;font-weight:600;white-space:nowrap}
  .period-nav.filled{background:var(--card);border-color:var(--card)}
  .acct-select{background:#141815;color:var(--text);border:1.5px solid #39423c;border-radius:10px;padding:8px 10px;font-size:17px;font-weight:600;min-height:52px;max-width:46%}
  .acct-select option{background:#222b26;color:var(--text)}

  /* Monthly */
  .summary-card{background:var(--card);border-radius:8px;padding:16px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin-bottom:16px}
  .summary-card .sc-label{font-size:16.5px;color:#d7e0d8}
  .summary-card .sc-amt{font-size:19px;font-weight:700;margin-top:4px}
  .summary-card .right{text-align:right}
  .day-card{border:1.5px solid #39423c;border-radius:12px;padding:16px 16px 14px;margin-bottom:14px}
  .day-card-date{text-align:center;font-size:21px;font-weight:600;margin-bottom:14px}
  .day-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .day-col-head{font-size:17px;font-weight:600;color:#e6ede7;padding-bottom:6px}
  .day-col-head.right{text-align:right}
  .day-entry{display:flex;justify-content:space-between;gap:8px;font-size:16.5px;padding:3px 0;width:100%;background:none;border:0;color:var(--text);text-align:left;min-height:0}
  .day-entry .nm{overflow-wrap:anywhere}
  .day-entry .am{white-space:nowrap}
  .day-total{text-align:right;font-size:17px;font-weight:700;margin-top:4px}
  .day-total.red{color:var(--exp-red)}
  .day-total.green{color:var(--inc-green)}
  .day-balance{margin-top:12px;text-align:right}
  .day-balance .db-label{font-size:17px;color:#d7e0d8}
  .day-balance .db-amt{font-size:18px;font-weight:700;margin-top:2px}

  /* Yearly */
  .year-table{width:100%}
  .year-head,.year-row{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:center;padding:11px 4px}
  .year-head{font-size:16.5px;font-weight:700;border-bottom:1px solid #39423c}
  .year-head span:not(:first-child),.year-row span:not(:first-child){text-align:right}
  .year-row{border-bottom:1px solid #232a25;font-size:16.5px;width:100%;background:none;border-top:0;border-left:0;border-right:0;color:var(--text);text-align:left;min-height:0}
  button.year-row:active{background:#141a15}
  .year-cf{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:11px 4px;border-bottom:1px solid #232a25;font-size:17px}
  .year-cf .cf-bal{text-align:right;color:var(--mint);font-weight:600}

  /* Ledger */
  .acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:4px 0 6px}
  .acct-card{background:var(--card-2);border:2px solid transparent;border-radius:8px;color:var(--text);padding:11px 10px;text-align:left;min-height:64px}
  .acct-card.selected{border-color:var(--mint);background:#22352b}
  .acct-name{font-size:14.5px;color:var(--muted);font-weight:600}
  .acct-bal{font-size:16.5px;font-weight:700;margin-top:3px;white-space:nowrap;display:block}
  .ledger-head,.ledger-row{display:grid;grid-template-columns:74px 1fr 76px 76px 84px;gap:6px;align-items:start}
  .ledger-head{background:var(--card-2);padding:11px 8px;font-size:13px;font-weight:700;color:#dfe7e0;margin-top:12px}
  .ledger-head span:nth-child(3),.ledger-head span:nth-child(4),.ledger-head span:nth-child(5){text-align:right}
  .ledger-row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:11px 8px;text-align:left;font-size:14px;min-height:52px}
  .ledger-row:active{background:#141a15}
  .ledger-row .d{color:var(--muted);font-size:13px;line-height:1.35}
  .ledger-row .t{font-weight:500;overflow-wrap:anywhere}
  .ledger-row .s{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere;display:block}
  .ledger-row .num{text-align:right;white-space:nowrap;font-weight:600}
  .ledger-row .num.debit{color:var(--danger)}
  .ledger-row .num.credit{color:var(--mint)}
  .ledger-row .cell-amt{display:none}
  .summary-box{background:var(--card-2);padding:6px 14px;margin-top:12px}
  .summary-line{display:flex;justify-content:space-between;padding:9px 0;font-size:16.5px;border-bottom:1px solid var(--line)}
  .summary-line:last-child{border-bottom:0}
  .summary-line .in{color:var(--mint)}
  .summary-line .out{color:var(--danger)}
  .ledger-names-head{font-size:16px;font-weight:700;margin:14px 2px 8px}
  .ledger-name-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
  .ledger-name-chip{background:var(--card-2);border:2px solid transparent;color:var(--text);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:600;min-height:44px}
  .ledger-name-chip.selected{border-color:var(--mint);background:#22352b}
  .ledger-name-chip .cnt{color:var(--muted);font-weight:500;font-size:13px;margin-left:5px}
  .empty-note{color:var(--muted);font-size:16px;padding:16px 8px;margin:0}

  /* FAB */
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;min-width:64px;height:64px;padding:0 14px;border-radius:16px;border:0;background:var(--teal);color:#eafff6;font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .fab:active{background:var(--teal-dark)}
  .fab .pdf-txt{font-size:17px;font-weight:800;letter-spacing:.4px}
  .fab.hidden{display:none}
  @media (min-width:700px){.fab{right:calc(50% - 322px)}}

  /* Sub-screen header (Charts / Report) */
  .sub-head{display:flex;align-items:center;gap:8px;padding:6px 0 14px}
  .sub-head h2{margin:0;font-size:27px;font-weight:600}
  .back-btn{background:none;border:0;color:var(--text);font-size:28px;width:44px;height:48px;display:flex;align-items:center;justify-content:center}

  /* Charts */
  .chart-top-row{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
  .alltime-btn{background:transparent;border:1.5px solid #39423c;border-radius:10px;color:var(--text);font-size:18px;font-weight:600;padding:8px 16px;min-height:52px}
  .alltime-btn.sel{background:var(--card);border-color:var(--card)}
  .info-note{display:flex;gap:12px;align-items:flex-start;font-size:17.5px;line-height:1.4;color:#e6ede7;margin:4px 2px 16px}
  .info-note .info-ic{flex:0 0 auto;width:30px;height:30px;border:2.5px solid var(--mint);border-radius:50%;color:var(--mint);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-top:2px}
  .chart-card{border:1.5px solid #39423c;border-radius:12px;padding:16px 14px;margin-bottom:16px}
  .seg-toggle{display:flex;border:1.5px solid #93a698;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .seg-toggle button{flex:1;background:transparent;border:0;padding:12px 4px;font-size:17px;font-weight:500;color:var(--text);min-height:50px}
  .seg-toggle button.sel{background:var(--card);font-weight:600}
  .seg-toggle button.sel::before{content:"✓ "}
  .donut-row{display:flex;align-items:center;gap:14px}
  .donut-left{flex:1;min-width:0}
  .donut-total{font-size:31px;font-weight:600;white-space:nowrap}
  .donut-label{font-size:21px;color:#e6ede7;margin-top:6px;line-height:1.3}
  .donut-svg{width:168px;height:168px;flex:0 0 auto}
  .seg-bar{display:flex;height:15px;border-radius:999px;overflow:hidden;margin:18px 0 6px;background:#232a25}
  .seg-bar div{height:100%}
  .acct-break{margin-top:10px}
  .acct-break .ab-amt{font-size:19px}
  .acct-break .ab-name{font-size:20px;font-weight:600;margin-top:2px}
  .collapse-head{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--text);font-size:18px;font-weight:700;letter-spacing:1.5px;padding:12px 2px;min-height:48px}
  .collapse-head .car{font-size:22px;color:#dfe7e0}
  .collapse-hint{text-align:center;font-size:18.5px;color:#e6ede7;margin:8px 0 14px}
  .cat-row{width:100%;background:none;border:0;border-bottom:1px solid #1c241e;color:var(--text);display:grid;grid-template-columns:34px 1fr 16px 62px 96px;gap:8px;align-items:center;padding:13px 2px;text-align:left;min-height:54px}
  .cat-row .cat-ic{font-size:21px;text-align:center}
  .cat-row .cat-nm{font-size:19px;font-weight:500;overflow-wrap:anywhere}
  .cat-row .cat-dot{width:15px;height:15px;border-radius:50%}
  .cat-row .cat-pct{font-size:17px;text-align:right}
  .cat-row .cat-am{font-size:18px;text-align:right;white-space:nowrap}
  .cat-entries{list-style:none;margin:0;padding:2px 0 10px 42px}
  .cat-entries li{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px dashed #232a25;font-size:15.5px}
  .cat-entries .ce-sub{color:var(--muted);font-size:13px}
  .bar-legend{display:flex;gap:26px;flex-wrap:wrap;font-size:16.5px;margin:12px 0 4px}
  .bar-legend .dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  .bar-acct-row{display:flex;justify-content:flex-end;margin-top:10px}

  /* Report */
  .report-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .rep-chip{background:transparent;border:1.5px solid #39423c;border-radius:10px;color:var(--text);font-size:17.5px;font-weight:600;padding:10px 16px;min-height:50px}
  .rep-chip.sel{background:var(--card);border-color:var(--mint)}
  .range-inputs{display:flex;gap:10px;margin-bottom:14px}
  .range-inputs label{flex:1;font-size:13.5px;color:var(--muted);display:block}
  .range-inputs input{width:100%;background:#141815;border:1.5px solid #39423c;border-radius:10px;color:var(--text);padding:10px;margin-top:5px;font-size:16px}
  .preview-page{background:#ffffff;color:#1c1c1c;border-radius:4px;padding:26px 20px 30px;min-height:420px}
  .preview-page h3{margin:0;text-align:center;color:#0e8a75;font-size:19px;font-weight:700}
  .preview-page .pp-name{text-align:center;color:#6a1fa2;font-size:16.5px;font-weight:600;margin-top:5px;min-height:22px}
  .preview-page .pp-meta{text-align:center;color:#666;font-size:13px;margin-top:4px}
  .preview-page table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
  .preview-page th,.preview-page td{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left;vertical-align:top}
  .preview-page th{color:#444}
  .preview-page td.num,.preview-page th.num{text-align:right;white-space:nowrap}
  .preview-page .pp-note{color:#555;font-size:12.5px}
  .preview-page .pp-totals{margin-top:14px;font-size:14px;line-height:1.7;text-align:right}
  .report-actions{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border-radius:999px;padding:13px;font-size:16.5px;font-weight:600;min-height:50px;border:0}
  .btn-primary{background:var(--teal);color:#eafff6}
  .btn-ghost{background:transparent;border:1.5px solid #93a698;color:var(--text)}

  /* Sheets */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--sheet);color:var(--text);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
  .sheet-close{display:flex;margin:0 auto 6px;width:52px;height:40px;background:none;border:0;align-items:center;justify-content:center}
  .sheet-close span{width:34px;height:34px;border-radius:50%;background:#cfd8d1;color:#223028;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
  .sheet h2.sheet-title{margin:2px 0 14px;font-size:22px;font-weight:700;text-align:center}
  .toggle{display:flex;border:1.5px solid #93a698;border-radius:999px;overflow:hidden;margin:8px 0 18px}
  .toggle button{flex:1;background:transparent;border:0;padding:13px 4px;font-size:17px;font-weight:500;color:var(--text);min-height:52px}
  .toggle button.sel{background:#2e4238;font-weight:600}
  .toggle button.sel::before{content:"✓ "}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;color:#c9d4cb;margin-bottom:6px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid #93a698;padding:9px 2px;font-size:18px;color:var(--text);outline:none;border-radius:0}
  .field textarea{border:1.5px solid #93a698;border-radius:8px;padding:10px;min-height:60px;resize:vertical;background:rgba(255,255,255,.05)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint)}
  .field select option{background:#222b26;color:var(--text)}
  .entry-top-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:6px}
  .cat-icon-btn{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:1.5px solid #93a698;background:var(--sheet-2);font-size:25px;display:flex;align-items:center;justify-content:center;min-height:52px}
  .entry-top-row .field{margin-bottom:0}
  .save-fab{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:0;background:var(--mint-btn);color:#0d2b20;font-size:27px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .from-label{font-size:16px;color:#c9d4cb;margin:14px 0 2px}
  .from-acct-btn{width:100%;background:none;border:0;color:var(--text);text-align:left;padding:4px 0 0;min-height:0}
  .from-acct-name{font-size:23px;font-weight:700}
  .from-type{font-size:16.5px;color:#c9d4cb;margin:3px 0 6px}
  .desc-row{display:flex;gap:12px;align-items:flex-start}
  .desc-row .desc-ic{font-size:22px;margin-top:10px;color:#c9d4cb}
  .desc-row .field{flex:1}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .btn-danger{background:transparent;border:1.5px solid #a05a4e;color:var(--danger);flex:1;border-radius:999px;padding:13px;font-size:16.5px;font-weight:600;min-height:50px}
  .error-msg{display:none;background:#4a2c26;color:#ffd9d2;border-radius:8px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
  .error-msg.show{display:block}
  .picker-list{list-style:none;margin:0;padding:0}
  .picker-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid #4a574e;color:var(--text);padding:14px 6px;font-size:18px;text-align:left;min-height:56px}
  .picker-item .pi-ic{font-size:23px;width:34px;text-align:center;flex:0 0 auto}
  .picker-item .pi-check{margin-left:auto;color:var(--mint);font-weight:800}
  .picker-item:active{background:#2c352f}

  /* Inline input row (custom category) */
  .tag-input-row{display:flex;gap:10px;align-items:flex-end}
  .tag-input-row input{flex:1;background:transparent;border:0;border-bottom:1.5px solid #93a698;padding:9px 2px;font-size:17px;color:var(--text);outline:none}
  .tag-add-btn{flex:0 0 auto;background:var(--teal);color:#eafff6;border:0;border-radius:999px;padding:10px 18px;font-size:15.5px;font-weight:600;min-height:44px}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;z-index:60;background:#e8f5ec;color:#12241a;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:92vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:520px){
    .icon-btn{width:36px}
    .icon-btn svg{width:21px;height:21px}
    .tab{font-size:15px;padding-left:2px;padding-right:2px;letter-spacing:-.2px}
    .date-card{padding:13px 2px;gap:0}
    .nav-arrow{width:32px;font-size:24px}
    .date-main{gap:8px}
    .day-num{font-size:34px}
    .date-line1{font-size:16.5px}
    .date-line2{font-size:15px}
    .balance-label{font-size:15px}
    .balance-amt{font-size:15.5px}
    .ledger-head{display:none}
    .ledger-row{grid-template-columns:1fr auto;grid-template-areas:"main amt" "main bal"}
    .ledger-row .d{display:none}
    .ledger-row .cell-main{grid-area:main}
    .ledger-row .cell-amt{display:block;grid-area:amt;text-align:right}
    .ledger-row .cell-bal{grid-area:bal;text-align:right;color:var(--muted);font-weight:500;font-size:13px}
    .ledger-row .col-num{display:none}
    .donut-total{font-size:25px}
    .donut-svg{width:138px;height:138px}
    .cat-row{grid-template-columns:30px 1fr 14px 54px 84px}
    .cat-row .cat-nm{font-size:16.5px}
    .cat-row .cat-am{font-size:16px}
    .period-nav .period-label{font-size:17.5px}
    .acct-select{font-size:15.5px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <button class="icon-btn" id="editProfileBtn" aria-label="Edit name and opening balance" title="Name &amp; opening balance">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" data-tab="daily">Daily</button>
      <button class="tab" data-tab="monthly">Monthly</button>
      <button class="tab" data-tab="yearly">Yearly</button>
      <button class="tab" data-tab="ledger">Ledger</button>
    </nav>
    <button class="icon-btn" id="chartsBtn" aria-label="Charts" title="Charts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 1.98C17.48 4.99 21 8.95 21 13.99h-8.97V3.98zM13 15h8c-.62 3.24-3.12 5.83-6.36 6.74L13 15z"/></svg>
    </button>
  </div>
  <main id="mainView" aria-live="polite"></main>
</div>

<button class="fab" id="fab" aria-label="Add new entry">+</button>

<!-- Entry sheet -->
<div class="overlay" id="entryOverlay" role="dialog" aria-modal="true" aria-label="Entry form">
  <div class="sheet">
    <button class="sheet-close" id="closeSheetBtn" aria-label="Close"><span>⌄</span></button>
    <div class="error-msg" id="formError"></div>
    <div class="toggle" role="group" aria-label="Entry type">
      <button type="button" id="typeIncome">Income (Credit)</button>
      <button type="button" id="typeExpense" class="sel">Expense (Debit)</button>
    </div>

    <div class="entry-top-row">
      <button type="button" class="cat-icon-btn" id="catIconBtn" aria-label="Choose category" title="Category">▦</button>
      <div class="field" style="flex:1.4">
        <input type="text" id="fText" placeholder="Enter Text" autocomplete="off" aria-label="Enter Text" />
      </div>
      <div class="field" style="flex:1">
        <input type="number" id="fAmount" placeholder="Amount" inputmode="decimal" min="0" step="0.01" aria-label="Amount" />
      </div>
      <button class="save-fab" id="quickSaveBtn" aria-label="Save entry">✓</button>
    </div>
    <p style="margin:4px 0 0 64px;font-size:13.5px;color:#c9d4cb">Category: <strong id="catNameLabel">Misc</strong> — tap the icon to change</p>

    <div class="field" style="margin-top:14px">
      <label for="fDate">Date</label>
      <input type="date" id="fDate" />
    </div>

    <p class="from-label" id="fromLabel">Debit From</p>
    <button type="button" class="from-acct-btn" id="fromAcctBtn" aria-label="Choose account">
      <span class="from-acct-name" id="fromAcctName">Cash</span>
      <span class="from-type" id="fromType" style="display:block">Debit</span>
    </button>

    <div class="field">
      <label for="fLedger">Ledger</label>
      <select id="fLedger"></select>
    </div>
    <div class="field" id="newLedgerField" style="display:none">
      <label for="fLedgerNew">New Ledger Name</label>
      <input type="text" id="fLedgerNew" placeholder="New ledger name (e.g. Shop, Home, Salary)" autocomplete="off" />
    </div>


    <div class="desc-row">
      <span class="desc-ic" aria-hidden="true">✎</span>
      <div class="field">
        <label for="fRemarks">Description</label>
        <textarea id="fRemarks" placeholder="Description"></textarea>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none">Delete</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Entry</button>
    </div>
  </div>
</div>

<!-- Account picker -->
<div class="overlay" id="accountOverlay" role="dialog" aria-modal="true" aria-label="Choose account">
  <div class="sheet">
    <button class="sheet-close" id="closeAccountBtn" aria-label="Close"><span>⌄</span></button>
    <h2 class="sheet-title" id="accountPickerTitle">Debit From</h2>
    <ul class="picker-list" id="accountList"></ul>
  </div>
</div>

<!-- Category picker -->
<div class="overlay" id="categoryOverlay" role="dialog" aria-modal="true" aria-label="Choose category">
  <div class="sheet">
    <button class="sheet-close" id="closeCategoryBtn" aria-label="Close"><span>⌄</span></button>
    <h2 class="sheet-title">Category</h2>
    <ul class="picker-list" id="categoryList"></ul>
    <div class="field" style="margin-top:16px">
      <label for="customCatInput">Add Your Own Category</label>
      <div class="tag-input-row">
        <input type="text" id="customCatInput" placeholder="New category name" autocomplete="off" />
        <button type="button" class="tag-add-btn" id="addCustomCatBtn">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- Name / opening balance sheet (pencil) -->
<div class="overlay" id="profileOverlay" role="dialog" aria-modal="true" aria-label="Name and opening balance">
  <div class="sheet">
    <button class="sheet-close" id="closeProfileBtn" aria-label="Close"><span>⌄</span></button>
    <h2 class="sheet-title">Name &amp; Opening Balance</h2>
    <div class="field">
      <label for="profileNameInput">Your Name (shown on the report)</label>
      <input type="text" id="profileNameInput" placeholder="Enter your name" autocomplete="off" />
    </div>
    <div class="field">
      <label for="openingInput">Opening Balance — C/F (Rs)</label>
      <input type="number" id="openingInput" inputmode="decimal" step="0.01" placeholder="0.00" />
    </div>
    <p style="color:#c9d4cb;font-size:14.5px;line-height:1.5;margin:0 0 14px">The opening balance is the amount you had before starting this diary. Each day's C/F is calculated from it.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelProfileBtn">Cancel</button>
      <button class="btn btn-primary" id="saveProfileBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var LS_ENTRIES = "mdd-web-entries-v1";
  var LS_OPENINGS = "mdd-web-openings-v2";
  var LS_OPENING_OLD = "mdd-web-opening-v1";
  var LS_LEDGERS = "mdd-web-ledgers-v2";
  var LS_LEDGERS_OLD = "mdd-web-ledgers-v1";
  var LS_NAME = "mdd-web-profilename-v1";
  var LS_OPENING1 = "mdd-web-opening-single-v1";
  var LS_CUSTOMCATS = "mdd-web-customcats-v1";
  var ADD_NEW_LEDGER = "__add_new_ledger__";
  var ACCOUNTS = ["Cash","Bank","JazzCash","Easypaisa","Other"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DAYS_S = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var EXPENSE_CATS = [
    {name:"Electricity", icon:"⚡", color:"#7c4dff"},
    {name:"Petrol/Gas", icon:"⛽", color:"#8e7cc3"},
    {name:"Kids", icon:"☺", color:"#7cb342"},
    {name:"Medicines", icon:"✚", color:"#8e24aa"},
    {name:"Mobile", icon:"▯", color:"#c218b8"},
    {name:"Vegetables", icon:"🥕", color:"#2e8b74"},
    {name:"Food and Dining", icon:"✂", color:"#26b6c9"},
    {name:"Misc", icon:"!", color:"#f4511e"},
    {name:"Education", icon:"🎓", color:"#b08968"}
  ];
  var INCOME_CATS = [
    {name:"Salary", icon:"💼", color:"#26b6c9"},
    {name:"Business", icon:"🏢", color:"#e0a458"},
    {name:"Rent", icon:"🏠", color:"#5b8dd9"},
    {name:"Gift", icon:"🎁", color:"#c95d7b"},
    {name:"Other", icon:"•", color:"#8a8f98"}
  ];
  var EXTRA_COLORS = ["#4db3c9","#a3b34d","#d97c4a","#7a68c9","#3f9e6e","#b04a4a"];

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function parseJSON(raw, fallback){ try{ var v = raw ? JSON.parse(raw) : null; return v==null ? fallback : v; }catch(e){ return fallback; } }

  /* ---------- data ---------- */
  function loadEntries(){
    var arr = parseJSON(lsGet(LS_ENTRIES), []);
    if(!Array.isArray(arr)) return [];
    arr.forEach(function(e){
      if(!e.category) e.category = (e.type==="income" ? "Other" : "Misc");
      if(!Array.isArray(e.tags)) e.tags = [];
      if(!e.account) e.account = "Cash";
    });
    return arr;
  }
  function loadOpening(){
    var single = parseFloat(lsGet(LS_OPENING1));
    if(!isNaN(single)) return single;
    var obj = parseJSON(lsGet(LS_OPENINGS), null);
    if(obj && typeof obj.Personal === "number") return obj.Personal;
    var old = parseFloat(lsGet(LS_OPENING_OLD));
    return isNaN(old) ? 0 : old;
  }
  function loadLedgers(){
    var obj = parseJSON(lsGet(LS_LEDGERS), null);
    var out = [];
    if(Array.isArray(obj)) out = obj.slice();
    else if(obj && typeof obj === "object"){
      ["Personal","Business"].forEach(function(p){
        if(Array.isArray(obj[p])) obj[p].forEach(function(n){ if(out.indexOf(n)===-1) out.push(n); });
      });
    } else {
      var old = parseJSON(lsGet(LS_LEDGERS_OLD), []);
      if(Array.isArray(old)) out = old.slice();
    }
    return out.filter(function(x){ return typeof x==="string" && x.trim(); });
  }
  function loadCustomCats(){
    var o = parseJSON(lsGet(LS_CUSTOMCATS), {expense:[], income:[]});
    if(!Array.isArray(o.expense)) o.expense = [];
    if(!Array.isArray(o.income)) o.income = [];
    return o;
  }

  var entries = loadEntries();
  var opening = loadOpening();
  var ledgerNames = loadLedgers();
  var profileName = lsGet(LS_NAME) || "";
  var customCats = loadCustomCats();
  entries.forEach(function(e){ if(e.ledger && ledgerNames.indexOf(e.ledger)===-1) ledgerNames.push(e.ledger); });

  function persist(){
    lsSet(LS_ENTRIES, JSON.stringify(entries));
    lsSet(LS_OPENING1, String(opening));
    lsSet(LS_LEDGERS, JSON.stringify(ledgerNames));
    lsSet(LS_NAME, profileName);
    lsSet(LS_CUSTOMCATS, JSON.stringify(customCats));
  }
  function catsFor(kind){
    var base = kind === "income" ? INCOME_CATS : EXPENSE_CATS;
    var out = base.slice();
    customCats[kind].forEach(function(n, i){
      if(!out.some(function(c){ return c.name.toLowerCase()===n.toLowerCase(); }))
        out.push({name:n, icon:"▦", color:EXTRA_COLORS[i % EXTRA_COLORS.length]});
    });
    return out;
  }
  function catInfo(kind, name){
    var list = catsFor(kind);
    for(var i=0;i<list.length;i++) if(list[i].name===name) return list[i];
    return {name:name || "Misc", icon:"▦", color:"#8a8f98"};
  }
  function ensureLedger(name){
    name = (name||"").trim();
    if(name && ledgerNames.indexOf(name)===-1) ledgerNames.push(name);
  }

  /* ---------- formatting ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function toKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function todayKey(){ return toKey(new Date()); }
  function fmt(n){
    var neg = n < 0; var v = Math.abs(n);
    var s = v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg?"-":"") + "Rs" + s;
  }
  function fmtPlain(n){
    var v = Math.abs(n);
    return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  var state = {
    tab: "daily",
    date: todayKey(),
    monthCursor: todayKey().slice(0,7),
    yearCursor: new Date().getFullYear(),
    monthAccount: "All",
    yearAccount: "All",
    ledgerAccount: "All",
    ledgerNameFilter: "",
    chartType: "expense",
    chartPeriod: "month",
    chartMonth: todayKey().slice(0,7),
    chartAccount: "All",
    chartCollapseOpen: true,
    chartExpandedCat: "",
    reportYear: new Date().getFullYear(),
    reportCustom: false,
    reportFrom: "",
    reportTo: "",
    reportShowExpense: true,
    reportShowIncome: true,
    reportShowNotes: true
  };

  /* ---------- calculations ---------- */
  function signed(e){ return e.type === "income" ? +e.amount : -(+e.amount); }
  function balanceBefore(key, account){
    var total = (account && account !== "All") ? 0 : opening;
    entries.forEach(function(e){
      if(e.date < key && (!account || account==="All" || e.account===account)) total += signed(e);
    });
    return total;
  }
  function totalBalance(account){
    var total = (account && account!=="All") ? 0 : opening;
    entries.forEach(function(e){
      if(!account || account==="All" || e.account===account) total += signed(e);
    });
    return total;
  }
  function dayEntries(key){ return entries.filter(function(e){ return e.date===key; }); }
  function sumType(list, type){ var t=0; list.forEach(function(e){ if(e.type===type) t += +e.amount; }); return t; }
  /* ---------- shared render helpers ---------- */
  var main = document.getElementById("mainView");
  var topbar = document.getElementById("topbar");
  var fab = document.getElementById("fab");

  function dateCardHTML(opts){
    return '<div class="date-card">' +
      '<button class="nav-arrow" data-nav="-1" aria-label="Previous">‹</button>' +
      '<div class="date-main"><div class="day-num">'+esc(opts.big)+'</div>' +
      '<div class="date-texts"><div class="date-line1">'+esc(opts.line1)+'</div>' +
      '<div class="date-line2">'+esc(opts.line2)+'</div></div></div>' +
      '<div class="balance-box"><div class="balance-label">Balance</div>' +
      '<div class="balance-amt">'+esc(fmt(opts.balance))+'</div></div>' +
      '<button class="nav-arrow" data-nav="1" aria-label="Next">›</button></div>';
  }
  function accountOptionsHTML(sel){
    var h = '<option value="All"'+(sel==="All"?" selected":"")+'>All Accounts</option>';
    ACCOUNTS.forEach(function(a){ h += '<option value="'+a+'"'+(sel===a?" selected":"")+'>'+a+'</option>'; });
    return h;
  }
  function entryItemHTML(e, showDate){
    var sub = [];
    if(showDate){ var d0 = parseKey(e.date); sub.push(DAYS_S[d0.getDay()]+", "+d0.getDate()+" "+MONTHS_S[d0.getMonth()]); }
    if(e.category) sub.push(e.category);
    sub.push(e.account || "Cash");
    if(e.ledger) sub.push(e.ledger);
    if(e.remarks) sub.push(e.remarks);
    return '<li><div class="entry-item" data-edit="'+e.id+'" role="button" tabindex="0">' +
      '<span class="entry-main"><span class="entry-text">'+esc(e.text)+'</span>' +
      '<span class="entry-sub">'+esc(sub.join(" • "))+'</span></span>' +
      '<span class="entry-amt '+(e.type==="income"?"credit":"debit")+'">'+esc(fmt(+e.amount))+'</span>' +
      '</div></li>';
  }
  function bindNav(fn){
    main.querySelectorAll("[data-nav]").forEach(function(b){
      b.addEventListener("click", function(){ fn(+b.getAttribute("data-nav")); });
    });
  }
  function bindEditButtons(){
    main.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click", function(){ openSheet(b.getAttribute("data-edit")); });
      var timer = null;
      b.addEventListener("pointerdown", function(){
        timer = setTimeout(function(){ openSheet(b.getAttribute("data-edit")); }, 550);
      });
      ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
        b.addEventListener(ev, function(){ if(timer) clearTimeout(timer); });
      });
    });
  }

  /* ---------- DAILY ---------- */
  function renderDaily(){
    var d = parseKey(state.date);
    var cf = balanceBefore(state.date);
    var list = dayEntries(state.date);
    var inc = list.filter(function(e){ return e.type==="income"; });
    var exp = list.filter(function(e){ return e.type==="expense"; });
    var incTotal = sumType(list,"income"), expTotal = sumType(list,"expense");
    var balance = cf + incTotal - expTotal;
    var hint = "Tap on '+' to add new item and long press an entry to edit.";
    var html = "";
    html += dateCardHTML({
      big: d.getDate(),
      line1: MONTHS[d.getMonth()] + ", " + d.getFullYear(),
      line2: DAYS[d.getDay()],
      balance: balance
    });
    html += '<div class="cf-row"><span>C/F</span><span class="amt">'+esc(fmt(cf))+'</span></div>';
    html += '<div class="section-head"><h2>Income (Credit)</h2><span class="total">'+esc(fmt(incTotal))+'</span></div>';
    if(inc.length) html += '<ul class="entry-list">' + inc.map(function(e){ return entryItemHTML(e,false); }).join("") + '</ul>';
    else html += '<p class="hint">'+hint+'</p>';
    html += '<div class="section-head"><h2>Expense (Debit)</h2><span class="total">'+esc(fmt(expTotal))+'</span></div>';
    if(exp.length) html += '<ul class="entry-list">' + exp.map(function(e){ return entryItemHTML(e,false); }).join("") + '</ul>';
    else html += '<p class="hint">'+hint+'</p>';
    main.innerHTML = html;
    bindNav(function(dir){
      var nd = parseKey(state.date); nd.setDate(nd.getDate()+dir);
      state.date = toKey(nd); render();
    });
    bindEditButtons();
  }

  /* ---------- MONTHLY ---------- */
  function renderMonthly(){
    var parts = state.monthCursor.split("-");
    var y = +parts[0], m = +parts[1]-1;
    var acct = state.monthAccount;
    var firstKey = state.monthCursor + "-01";
    var cf = balanceBefore(firstKey, acct);
    var monthEntries = entries.filter(function(e){
      return e.date.slice(0,7)===state.monthCursor && (acct==="All" || e.account===acct);
    });
    var incTotal = sumType(monthEntries,"income"), expTotal = sumType(monthEntries,"expense");
    var balance = cf + incTotal - expTotal;
    var html = '<div class="period-row">' +
      '<div class="period-nav"><button class="nav-arrow" data-mnav="-1" aria-label="Previous month">‹</button>' +
      '<span class="period-label">'+MONTHS[m]+' '+y+'</span>' +
      '<button class="nav-arrow" data-mnav="1" aria-label="Next month">›</button></div>' +
      '<select class="acct-select" id="monthAcctSel" aria-label="Account filter">'+accountOptionsHTML(acct)+'</select></div>';
    html += '<div class="summary-card">' +
      '<div><div class="sc-label">Total Income (Credit)</div><div class="sc-amt">'+esc(fmt(incTotal))+'</div></div>' +
      '<div class="right"><div class="sc-label">Total Expense (Debit)</div><div class="sc-amt">'+esc(fmt(expTotal))+'</div></div>' +
      '<div><div class="sc-label">C/F</div><div class="sc-amt">'+esc(fmt(cf))+'</div></div>' +
      '<div class="right"><div class="sc-label">Balance</div><div class="sc-amt">'+esc(fmt(balance))+'</div></div></div>';

    var byDay = {};
    monthEntries.forEach(function(e){ (byDay[e.date] = byDay[e.date] || []).push(e); });
    var days = Object.keys(byDay).sort().reverse();
    if(!days.length) html += '<p class="empty-note">No entries this month.</p>';
    days.forEach(function(key){
      var list = byDay[key];
      var dd = parseKey(key);
      var dInc = list.filter(function(e){ return e.type==="income"; });
      var dExp = list.filter(function(e){ return e.type==="expense"; });
      var dIncT = sumType(list,"income"), dExpT = sumType(list,"expense");
      var endBal = balanceBefore(key, acct) + dIncT - dExpT + (acct==="All" ? 0 : 0);
      // balanceBefore(key) is balance at start of that day; end of day:
      endBal = balanceBefore(key, acct) + dIncT - dExpT;
      // note: balanceBefore already excludes that day's entries, so add them:
      html += '<div class="day-card"><div class="day-card-date">'+DAYS_S[dd.getDay()]+', '+dd.getDate()+' '+MONTHS_S[m]+'</div>';
      html += '<div class="day-cols"><div class="day-col-head">Income (Credit)</div><div class="day-col-head right">Expense (Debit)</div>';
      html += '<div>' + dInc.map(function(e){
        return '<button class="day-entry" data-edit="'+e.id+'"><span class="nm">'+esc(e.text)+'</span><span class="am">'+esc(fmtPlain(+e.amount))+'</span></button>';
      }).join("") + (dInc.length ? '<div class="day-total green">'+esc(fmt(dIncT))+'</div>' : '') + '</div>';
      html += '<div>' + dExp.map(function(e){
        return '<button class="day-entry" data-edit="'+e.id+'"><span class="nm">'+esc(e.text)+'</span><span class="am">'+esc(fmtPlain(+e.amount))+'</span></button>';
      }).join("") + (dExp.length ? '<div class="day-total red">'+esc(fmt(dExpT))+'</div>' : '') + '</div>';

  /* ---------- CHARTS ---------- */
  function chartEntries(){
    var type = state.chartType;
    return entries.filter(function(e){
      if(e.type !== type) return false;
      if(state.chartPeriod === "month" && e.date.slice(0,7) !== state.chartMonth) return false;
      return true;
    });
  }
  function donutSVG(byCat, cats, total){
    var cx = 100, cy = 100, r = 78, sw = 30;
    var C = 2 * Math.PI * r;
    if(!cats.length || total <= 0)
      return '<svg class="donut-svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="'+r+'" fill="none" stroke="#2a332c" stroke-width="'+sw+'"/></svg>';
    var offset = C * 0.25, parts = "";
    cats.forEach(function(c){
      var frac = byCat[c] / total;
      var len = Math.max(frac * C - 2, 0.5);
      parts += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+catInfo(state.chartType, c).color+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'"/>';
      offset += frac * C;
    });
    parts += '<g fill="#e6ede7"><path d="M100 82 l10 14 h-20 z"/><rect x="86" y="100" width="12" height="12"/><circle cx="108" cy="106" r="7"/></g>';
    return '<svg class="donut-svg" viewBox="0 0 200 200" role="img" aria-label="Donut chart">' + parts + '</svg>';
  }
  function barChartSVG(){
    var parts = state.chartMonth.split("-");
    var y = +parts[0], m = +parts[1]-1;
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var acct = state.chartAccount;
    var perDay = [];
    var maxV = 0;
    for(var d=1; d<=daysInMonth; d++){
      var key = state.chartMonth + "-" + pad(d);
      var list = entries.filter(function(e){ return e.date===key && (acct==="All" || e.account===acct); });
      var di = sumType(list,"income"), de = sumType(list,"expense");
      perDay.push({d:d, inc:di, exp:de});
      if(di > maxV) maxV = di;
      if(de > maxV) maxV = de;
    }
    var W = 660, H = 300, base = 252, top = 26, plotH = base - top;
    var step = (W - 70) / daysInMonth;
    var bw = Math.max(Math.min(step * 0.32, 12), 2.5);
    function yLab(v){
      if(v >= 1000){ var k = v/1000; return (k % 1 === 0 ? k : k.toFixed(1)) + "K"; }
      return String(Math.round(v));
    }
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Daily income and expense bar chart">';
    if(maxV <= 0){
      svg += '<text x="'+(W/2)+'" y="150" fill="#a7b3aa" font-size="17" text-anchor="middle">No entries this month</text>';
    } else {
      var ticks = 5;
      for(var t=0; t<=ticks; t++){
        var v = maxV * t / ticks;
        var yy = base - plotH * t / ticks;
        svg += '<line x1="64" y1="'+yy+'" x2="'+(W-6)+'" y2="'+yy+'" stroke="#39423c" stroke-dasharray="5 5"/>' +
               '<text x="58" y="'+(yy+5)+'" fill="#dfe7e0" font-size="14" text-anchor="end">'+yLab(v)+'</text>';
      }
      svg += '<line x1="64" y1="'+top+'" x2="64" y2="'+base+'" stroke="#5b6f61"/>';
      svg += '<line x1="64" y1="'+base+'" x2="'+(W-6)+'" y2="'+base+'" stroke="#5b6f61"/>';
      var labelEvery = daysInMonth > 20 ? 5 : (daysInMonth > 10 ? 2 : 1);
      perDay.forEach(function(pd, i){
        var x = 70 + i * step + step/2;
        var ih = pd.inc / maxV * plotH, eh = pd.exp / maxV * plotH;
        if(pd.inc > 0) svg += '<rect x="'+(x-bw-1)+'" y="'+(base-ih)+'" width="'+bw+'" height="'+ih+'" fill="#7ed491"/>';
        if(pd.exp > 0) svg += '<rect x="'+(x+1)+'" y="'+(base-eh)+'" width="'+bw+'" height="'+eh+'" fill="#f2766d"/>';
        if(pd.d === 1 || pd.d % labelEvery === 0)
          svg += '<text x="'+x+'" y="'+(base+24)+'" fill="#dfe7e0" font-size="13.5" text-anchor="middle">'+pad(pd.d)+' '+MONTHS_S[m]+'</text>';
      });
    }
    svg += '</svg>';
    return svg;
  }
  function renderCharts(){
    var parts = state.chartMonth.split("-");
    var y = +parts[0], m = +parts[1]-1;
    var type = state.chartType;
    var list = chartEntries();
    var byCat = {}, byAcct = {};
    list.forEach(function(e){
      var c = e.category || (type==="income" ? "Other" : "Misc");
      byCat[c] = (byCat[c] || 0) + (+e.amount);
      byAcct[e.account || "Cash"] = (byAcct[e.account || "Cash"] || 0) + (+e.amount);
    });
    var total = list.reduce(function(t,e){ return t + (+e.amount); }, 0);
    var catsDesc = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
    var catsAsc = Object.keys(byCat).sort(function(a,b){ return byCat[a]-byCat[b]; });

    var html = '<div class="sub-head"><button class="back-btn" id="chartsBack" aria-label="Back">←</button><h2>Charts</h2></div>';
    html += '<div class="chart-top-row">' +
      '<button class="alltime-btn'+(state.chartPeriod==="all"?" sel":"")+'" id="allTimeBtn">All time</button>' +
      '<div class="period-nav filled" style="flex:1"><button class="nav-arrow" data-cnav="-1" aria-label="Previous month">‹</button>' +
      '<span class="period-label">'+MONTHS[m]+' '+y+'</span>' +
      '<button class="nav-arrow" data-cnav="1" aria-label="Next month">›</button></div></div>';
    html += '<div class="info-note"><span class="info-ic">!</span><span>Fund transfers between the accounts are excluded from calculation</span></div>';

    html += '<div class="chart-card"><div class="seg-toggle" role="group" aria-label="Chart type">' +
      '<button data-ctype="income" class="'+(type==="income"?"sel":"")+'">Income (Credit)</button>' +
      '<button data-ctype="expense" class="'+(type==="expense"?"sel":"")+'">Expense (Debit)</button></div>';
    if(total <= 0){
      html += '<p class="empty-note">No '+(type==="expense"?"expense":"income")+' entries in this period.</p>';
    } else {
      html += '<div class="donut-row"><div class="donut-left"><div class="donut-total">'+esc(fmt(total))+'</div>' +
        '<div class="donut-label">Total '+(type==="expense" ? "Expense<br>(Debit)" : "Income<br>(Credit)")+'</div></div>' +
        donutSVG(byCat, catsDesc, total) + '</div>';
      html += '<div class="seg-bar">' + catsDesc.map(function(c){
        return '<div style="width:'+(byCat[c]/total*100).toFixed(2)+'%;background:'+catInfo(type,c).color+'"></div>';
      }).join("") + '</div>';
      html += '<div class="acct-break">' + Object.keys(byAcct).sort(function(a,b){ return byAcct[b]-byAcct[a]; }).map(function(a){
        var col = "#f28bb4";
        return '<div style="margin-bottom:10px"><div class="ab-amt">'+esc(fmt(byAcct[a]))+'</div><div class="ab-name" style="color:'+col+'">'+esc(a)+'</div></div>';
      }).join("") + '</div>';
    }
    html += '</div>';

    /* Collapse / category details */
    html += '<div class="chart-card"><button class="collapse-head" id="collapseHead"><span>COLLAPSE</span><span class="car">'+(state.chartCollapseOpen ? "⌃" : "⌄")+'</span></button>';
    if(state.chartCollapseOpen){
      html += '<p class="collapse-hint">Click on each item below for details</p>';
      if(!catsAsc.length) html += '<p class="empty-note">No category data.</p>';
      catsAsc.forEach(function(c){
        var info = catInfo(type, c);
        var pct = total ? (byCat[c]/total*100) : 0;
        html += '<button class="cat-row" data-cat-row="'+esc(c)+'"><span class="cat-ic" style="color:'+info.color+'">'+esc(info.icon)+'</span>' +
          '<span class="cat-nm">'+esc(c)+'</span><span class="cat-dot" style="background:'+info.color+'"></span>' +
          '<span class="cat-pct">'+pct.toFixed(1)+'%</span><span class="cat-am">'+esc(fmtPlain(byCat[c]))+'</span></button>';
        if(state.chartExpandedCat === c){
          var catList = list.filter(function(e){ return (e.category||"")===c; })
            .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
          html += '<ul class="cat-entries">' + catList.map(function(e){
            var dd = parseKey(e.date);
            return '<li><span>'+esc(e.text)+' <span class="ce-sub">• '+DAYS_S[dd.getDay()]+', '+dd.getDate()+' '+MONTHS_S[dd.getMonth()]+' • '+esc(e.account||"Cash")+'</span></span><span>'+esc(fmtPlain(+e.amount))+'</span></li>';
          }).join("") + '</ul>';
        }
      });
    }
    html += '</div>';

    /* Bar chart */
    html += '<div class="chart-card">' + barChartSVG() +
      '<div class="bar-legend"><span><span class="dot" style="background:#7ed491"></span>Income (Credit)</span>' +
      '<span><span class="dot" style="background:#f2766d"></span>Expense (Debit)</span></div>' +
      '<div class="bar-acct-row"><select class="acct-select" id="chartAcctSel" aria-label="Account filter" style="max-width:60%">'+accountOptionsHTML(state.chartAccount)+'</select></div></div>';

    main.innerHTML = html;
    document.getElementById("chartsBack").addEventListener("click", function(){ setTab("daily"); });
    document.getElementById("allTimeBtn").addEventListener("click", function(){
      state.chartPeriod = state.chartPeriod === "all" ? "month" : "all"; render();
    });
    main.querySelectorAll("[data-cnav]").forEach(function(b){
      b.addEventListener("click", function(){
        var nd = new Date(y, m + (+b.getAttribute("data-cnav")), 1);
        state.chartMonth = nd.getFullYear()+"-"+pad(nd.getMonth()+1);
        state.chartPeriod = "month"; render();
      });
    });
    main.querySelectorAll("[data-ctype]").forEach(function(b){
      b.addEventListener("click", function(){ state.chartType = b.getAttribute("data-ctype"); state.chartExpandedCat = ""; render(); });
    });
    document.getElementById("collapseHead").addEventListener("click", function(){
      state.chartCollapseOpen = !state.chartCollapseOpen; render();
    });
    main.querySelectorAll("[data-cat-row]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = b.getAttribute("data-cat-row");
        state.chartExpandedCat = state.chartExpandedCat === c ? "" : c; render();
      });
    });
    document.getElementById("chartAcctSel").addEventListener("change", function(ev){ state.chartAccount = ev.target.value; render(); });
  }

  /* ---------- REPORT ---------- */
  function reportEntries(){
    var from, to;
    if(state.reportCustom && state.reportFrom && state.reportTo){ from = state.reportFrom; to = state.reportTo; }
    else { from = state.reportYear + "-01-01"; to = state.reportYear + "-12-31"; }
    return entries.filter(function(e){
      if(e.date < from || e.date > to) return false;
      if(e.type === "expense" && !state.reportShowExpense) return false;
      if(e.type === "income" && !state.reportShowIncome) return false;
      return true;
    }).sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }
  function renderReport(){
    var list = reportEntries();
    var totIn = sumType(list,"income"), totOut = sumType(list,"expense");
    var rangeLabel = (state.reportCustom && state.reportFrom && state.reportTo)
      ? state.reportFrom + " to " + state.reportTo : "Year " + state.reportYear;
    var html = '<div class="sub-head"><button class="back-btn" id="reportBack" aria-label="Back">←</button><h2>Report</h2></div>';
    html += '<div class="period-row">' +
      '<div class="period-nav"><button class="nav-arrow" data-rnav="-1" aria-label="Previous year">‹</button>' +
      '<span class="period-label">'+state.reportYear+'</span>' +
      '<button class="nav-arrow" data-rnav="1" aria-label="Next year">›</button></div>' +
      '<button class="rep-chip'+(state.reportCustom?" sel":"")+'" id="customRangeBtn" style="flex:1">Custom date range</button></div>';
    if(state.reportCustom){
      html += '<div class="range-inputs"><label>From<input type="date" id="repFrom" value="'+esc(state.reportFrom)+'"></label>' +
        '<label>To<input type="date" id="repTo" value="'+esc(state.reportTo)+'"></label></div>';
    }
    html += '<div class="report-chips">' +
      '<button class="rep-chip'+(state.reportShowExpense?" sel":"")+'" data-rep-toggle="expense">Expense (Debit)</button>' +
      '<button class="rep-chip'+(state.reportShowIncome?" sel":"")+'" data-rep-toggle="income">Income (Credit)</button>' +
      '<button class="rep-chip'+(state.reportShowNotes?" sel":"")+'" data-rep-toggle="notes">Notes</button></div>';

    var rows = "";
    var running = opening;
    // running balance from start of range: recompute balance before first entry date
    if(list.length) running = balanceBefore(list[0].date);
    list.forEach(function(e){
      running += signed(e);
      var dd = parseKey(e.date);
      rows += '<tr><td style="white-space:nowrap">'+pad(dd.getDate())+' '+MONTHS_S[dd.getMonth()]+' '+dd.getFullYear()+'</td>' +
        '<td>'+esc(e.text) + (state.reportShowNotes && e.remarks ? '<div class="pp-note">'+esc(e.remarks)+'</div>' : '') +
        '<div class="pp-note">'+esc(e.category||"")+' • '+esc(e.account||"Cash")+(e.ledger ? ' • '+esc(e.ledger) : '')+'</div></td>' +
        '<td class="num">'+(e.type==="expense" ? esc(fmtPlain(+e.amount)) : "—")+'</td>' +
        '<td class="num">'+(e.type==="income" ? esc(fmtPlain(+e.amount)) : "—")+'</td>' +
        '<td class="num">'+esc(fmtPlain(running))+'</td></tr>';
    });
    if(!list.length) rows = '<tr><td colspan="5" style="text-align:center;color:#777;padding:18px 4px">No entries in this period.</td></tr>';
    html += '<div class="preview-page"><h3>My Debit Diary</h3>' +
      '<div class="pp-name">'+esc(profileName)+'</div>' +
      '<div class="pp-meta">'+esc(rangeLabel)+' • Amounts in Rs</div>' +
      '<table><thead><tr><th>Date</th><th>Entry</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pp-totals">Total Income (Credit): <strong>'+esc(fmt(totIn))+'</strong><br>' +
      'Total Expense (Debit): <strong>'+esc(fmt(totOut))+'</strong><br>' +
      'Balance: <strong>'+esc(fmt(opening + sumType(entries,"income") - sumType(entries,"expense")))+'</strong></div></div>';
    html += '<div class="report-actions"><button class="btn btn-ghost" id="repBackBtn">Back</button>' +
      '<button class="btn btn-primary" id="repDownloadBtn">Download PDF</button></div>';
    main.innerHTML = html;
    document.getElementById("reportBack").addEventListener("click", function(){ setTab("monthly"); });
    document.getElementById("repBackBtn").addEventListener("click", function(){ setTab("monthly"); });
    document.getElementById("repDownloadBtn").addEventListener("click", exportPDF);
    main.querySelectorAll("[data-rnav]").forEach(function(b){
      b.addEventListener("click", function(){ state.reportYear += +b.getAttribute("data-rnav"); state.reportCustom = false; render(); });
    });
    document.getElementById("customRangeBtn").addEventListener("click", function(){
      state.reportCustom = !state.reportCustom;
      if(state.reportCustom && !state.reportFrom){ state.reportFrom = state.reportYear + "-01-01"; state.reportTo = todayKey(); }
      render();
    });
    if(state.reportCustom){
      document.getElementById("repFrom").addEventListener("change", function(ev){ state.reportFrom = ev.target.value; render(); });
      document.getElementById("repTo").addEventListener("change", function(ev){ state.reportTo = ev.target.value; render(); });
    }
    main.querySelectorAll("[data-rep-toggle]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.getAttribute("data-rep-toggle");
        if(k==="expense") state.reportShowExpense = !state.reportShowExpense;
        if(k==="income") state.reportShowIncome = !state.reportShowIncome;
        if(k==="notes") state.reportShowNotes = !state.reportShowNotes;
        render();
      });
    });
  }

  /* ---------- PDF export ---------- */
  function downloadBlob(name, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  }
  function pdfEscapeText(s){ return String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  function winAnsiBytes(str){
    var map = {"€":128,"£":163,"•":149,"—":151,"–":150};
    var out = [];
    for(var i=0;i<str.length;i++){
      var ch = str.charAt(i);
      if(map.hasOwnProperty(ch)) out.push(map[ch]);
      else { var c = str.charCodeAt(i); out.push(c < 256 ? c : 63); }
    }
    return out;
  }
  function makePDF(lines){
    var perPage = 46, chunks = [];
    for(var i=0;i<lines.length;i+=perPage) chunks.push(lines.slice(i, i+perPage));
    if(!chunks.length) chunks.push([""]);
    var pageCount = chunks.length;
    var bytes = [], offsets = {};
    function pushStr(s){ var b = winAnsiBytes(s); for(var j=0;j<b.length;j++) bytes.push(b[j]); }
    function beginObj(n){ offsets[n] = bytes.length; pushStr(n + " 0 obj\n"); }
    pushStr("%PDF-1.4\n");
    beginObj(1); pushStr("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    var kids = [];
    for(var p=0;p<pageCount;p++) kids.push((4 + p*2) + " 0 R");
    beginObj(2); pushStr("<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + pageCount + " >>\nendobj\n");
    beginObj(3); pushStr("<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>\nendobj\n");
    for(var q=0;q<pageCount;q++){
      var pageObj = 4 + q*2, contentObj = pageObj + 1;
      beginObj(pageObj);
      pushStr("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents " + contentObj + " 0 R >>\nendobj\n");
      var stream = "BT /F1 9 Tf 15 TL 42 806 Td\n";
      chunks[q].forEach(function(line, idx){
        if(idx > 0) stream += "T*\n";
        stream += "(" + pdfEscapeText(line) + ") Tj\n";
      });
      stream += "ET";
      var streamBytes = winAnsiBytes(stream);
      beginObj(contentObj);
      pushStr("<< /Length " + streamBytes.length + " >>\nstream\n");
      for(var s2=0;s2<streamBytes.length;s2++) bytes.push(streamBytes[s2]);
      pushStr("\nendstream\nendobj\n");
    }
    var totalObjs = 3 + pageCount*2;
    var xrefPos = bytes.length;
    pushStr("xref\n0 " + (totalObjs+1) + "\n0000000000 65535 f \n");
    for(var o=1;o<=totalObjs;o++){
      var off = String(offsets[o] || 0);
      while(off.length < 10) off = "0" + off;
      pushStr(off + " 00000 n \n");
    }
    pushStr("trailer\n<< /Size " + (totalObjs+1) + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF");
    return new Blob([new Uint8Array(bytes)], {type:"application/pdf"});
  }
  function padR(s, n){ s = String(s); while(s.length < n) s += " "; return s.slice(0, n); }
  function padL(s, n){ s = String(s); while(s.length < n) s = " " + s; return s.length > n ? s.slice(s.length - n) : s; }
  function exportPDF(){
    var list = reportEntries();
    var totIn = sumType(list,"income"), totOut = sumType(list,"expense");
    var running = list.length ? balanceBefore(list[0].date) : opening;
    var lines = [];
    lines.push("My Debit Diary");
    if(profileName) lines.push(profileName);
    lines.push("");
    lines.push(padR("Date", 13) + padR("Entry", 26) + padL("Debit", 13) + padL("Credit", 13) + padL("Balance", 14));
    lines.push("-------------------------------------------------------------------------------");
    list.forEach(function(e){
      running += signed(e);
      var dd = parseKey(e.date);
      lines.push(
        padR(pad(dd.getDate()) + " " + MONTHS_S[dd.getMonth()] + " " + dd.getFullYear(), 13) +
        padR(e.text, 26) +
        padL(e.type==="expense" ? fmtPlain(+e.amount) : "-", 13) +
        padL(e.type==="income" ? fmtPlain(+e.amount) : "-", 13) +
        padL(fmtPlain(running), 14)
      );
      if(state.reportShowNotes && e.remarks) lines.push(padR("", 13) + "Note: " + e.remarks);
    });
    if(!list.length) lines.push("No entries in this period.");
    lines.push("-------------------------------------------------------------------------------");
    lines.push("");
    lines.push("Total Income (Credit): " + fmt(totIn));
    lines.push("Total Expense (Debit): " + fmt(totOut));
    lines.push("Balance: " + fmt(running));
    downloadBlob("my-debit-diary-report.pdf", makePDF(lines));
    toast("PDF report downloaded ✓");
  }

  /* ---------- render / tabs / FAB ---------- */
  function updateFab(){
    if(state.tab === "report"){ fab.classList.add("hidden"); return; }
    fab.classList.remove("hidden");
    if(state.tab === "monthly" || state.tab === "yearly" || state.tab === "charts"){
      fab.innerHTML = '<span class="pdf-txt">PDF</span>';
      fab.setAttribute("aria-label", "Open PDF report");
    } else {
      fab.textContent = "+";
      fab.setAttribute("aria-label", "Add new entry");
    }
  }
  function render(){
    topbar.classList.toggle("hidden", state.tab === "charts" || state.tab === "report");
    document.querySelectorAll(".tab").forEach(function(t){
      t.classList.toggle("active", t.getAttribute("data-tab") === state.tab);
    });
    if(state.tab === "daily") renderDaily();
    else if(state.tab === "monthly") renderMonthly();
    else if(state.tab === "yearly") renderYearly();
    else if(state.tab === "ledger") renderLedger();
    else if(state.tab === "charts") renderCharts();
    else if(state.tab === "report") renderReport();
    updateFab();
  }
  function setTab(tab){ state.tab = tab; render(); window.scrollTo(0,0); }
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ setTab(t.getAttribute("data-tab")); });
  });
  document.getElementById("chartsBtn").addEventListener("click", function(){ setTab("charts"); });
  fab.addEventListener("click", function(){
    if(state.tab === "monthly" || state.tab === "yearly" || state.tab === "charts") setTab("report");
    else openSheet(null);
  });

  /* ---------- toast ---------- */
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  /* ---------- entry sheet ---------- */
  var overlay = document.getElementById("entryOverlay");
  var fDate = document.getElementById("fDate"), fText = document.getElementById("fText"),
      fAmount = document.getElementById("fAmount"),
      fLedger = document.getElementById("fLedger"), fRemarks = document.getElementById("fRemarks"),
      fLedgerNew = document.getElementById("fLedgerNew"), newLedgerField = document.getElementById("newLedgerField"),
      formError = document.getElementById("formError"),
      typeIncome = document.getElementById("typeIncome"), typeExpense = document.getElementById("typeExpense"),
      fromLabel = document.getElementById("fromLabel"), fromType = document.getElementById("fromType"),
      fromAcctName = document.getElementById("fromAcctName"),
      catIconBtn = document.getElementById("catIconBtn"), catNameLabel = document.getElementById("catNameLabel"),
      deleteBtn = document.getElementById("deleteBtn");
  var formType = "expense", editingId = null, formAccount = "Cash", formCategory = "Misc";

  function populateLedgerOptions(selected){
    var html = '<option value="">— No ledger —</option>';
    ledgerNames.forEach(function(name){
      html += '<option value="'+esc(name)+'"'+(name===selected ? " selected" : "")+'>'+esc(name)+'</option>';
    });
    html += '<option value="'+ADD_NEW_LEDGER+'">+ Add new ledger…</option>';
    fLedger.innerHTML = html;
    fLedger.value = selected || "";
    newLedgerField.style.display = "none";
    fLedgerNew.value = "";
  }
  fLedger.addEventListener("change", function(){
    if(fLedger.value === ADD_NEW_LEDGER){
      newLedgerField.style.display = "";
      setTimeout(function(){ fLedgerNew.focus(); }, 40);
    } else newLedgerField.style.display = "none";
  });
  function currentLedgerValue(){
    if(fLedger.value === ADD_NEW_LEDGER) return fLedgerNew.value.trim();
    return fLedger.value || "";
  }
  function syncCategoryUI(){
    var info = catInfo(formType, formCategory);
    catIconBtn.textContent = info.icon;
    catIconBtn.style.color = info.color;
    catNameLabel.textContent = info.name;
  }
  function setFormType(t){
    formType = t;
    typeIncome.classList.toggle("sel", t==="income");
    typeExpense.classList.toggle("sel", t==="expense");
    fromLabel.textContent = t==="income" ? "Credit To" : "Debit From";
    fromType.textContent = t==="income" ? "Credit" : "Debit";
    var def = t==="income" ? "Other" : "Misc";
    if(!catsFor(t).some(function(c){ return c.name===formCategory; })) formCategory = def;
    syncCategoryUI();
  }
  typeIncome.addEventListener("click", function(){ setFormType("income"); });
  typeExpense.addEventListener("click", function(){ setFormType("expense"); });

  function showError(msg){ formError.textContent = msg; formError.classList.add("show"); }
  function hideError(){ formError.classList.remove("show"); formError.textContent = ""; }

  function openSheet(id){
    hideError();
    editingId = id || null;
    if(id){
      var e = null;
      for(var i=0;i<entries.length;i++) if(entries[i].id===id) e = entries[i];
      if(!e) return;
      fDate.value = e.date; fText.value = e.text; fAmount.value = e.amount;
      formAccount = e.account || "Cash"; fRemarks.value = e.remarks || "";
      if(e.ledger) ensureLedger(e.ledger);
      populateLedgerOptions(e.ledger || "");
      formCategory = e.category || (e.type==="income" ? "Other" : "Misc");
      setFormType(e.type);
      deleteBtn.style.display = "";
    } else {
      fDate.value = state.tab==="daily" ? state.date : todayKey();
      fText.value = ""; fAmount.value = ""; formAccount = "Cash"; fRemarks.value = "";
      populateLedgerOptions(state.ledgerNameFilter || "");
      formCategory = "Misc";
      setFormType("expense");
      deleteBtn.style.display = "none";
    }
    fromAcctName.textContent = formAccount;
    overlay.classList.add("open");
    setTimeout(function(){ fText.focus(); }, 60);
  }
  function closeSheet(){ overlay.classList.remove("open"); editingId = null; }

  function saveEntry(){
    var text = fText.value.trim();
    var amount = parseFloat(fAmount.value);
    var date = fDate.value || todayKey();
    if(!text){ showError("Please enter the entry name (Enter Text) first."); fText.focus(); return; }
    if(isNaN(amount) || amount <= 0){ showError("Enter a valid Amount — it must be greater than 0."); fAmount.focus(); return; }
    var ledgerName = currentLedgerValue();
    if(fLedger.value === ADD_NEW_LEDGER && !ledgerName){ showError("Enter the new ledger name, or choose a ledger from the list."); fLedgerNew.focus(); return; }
    ensureLedger(ledgerName);
    var data = {
      date: date, type: formType, text: text, amount: Math.round(amount*100)/100,
      account: formAccount, category: formCategory, ledger: ledgerName,
      remarks: fRemarks.value.trim(), tags: []
    };
    if(editingId){
      for(var i=0;i<entries.length;i++) if(entries[i].id===editingId){ for(var k in data) entries[i][k]=data[k]; }
      toast("Entry updated ✓");
    } else {
      data.id = uid(); data.createdAt = Date.now();
      entries.push(data);
      toast(formType==="income" ? "Income (Credit) added ✓" : "Expense (Debit) added ✓");
    }
    persist();
    if(state.tab==="daily") state.date = date;
    if(state.tab==="monthly") state.monthCursor = date.slice(0,7);
    closeSheet(); render();
  }
  document.getElementById("saveBtn").addEventListener("click", saveEntry);
  document.getElementById("quickSaveBtn").addEventListener("click", saveEntry);
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
  overlay.addEventListener("click", function(ev){ if(ev.target===overlay) closeSheet(); });
  deleteBtn.addEventListener("click", function(){
    if(!editingId) return;
    entries = entries.filter(function(e){ return e.id!==editingId; });
    persist(); closeSheet(); render(); toast("Entry deleted");
  });

  /* ---------- account picker ---------- */
  var accountOverlay = document.getElementById("accountOverlay");
  function openAccountPicker(){
    document.getElementById("accountPickerTitle").textContent = formType === "income" ? "Credit To" : "Debit From";
    document.getElementById("accountList").innerHTML = ACCOUNTS.map(function(a){
      return '<li><button class="picker-item" data-acct-pick="'+a+'"><span style="flex:1">'+a+'</span>' +
        (a===formAccount ? '<span class="pi-check">✓</span>' : '') + '</button></li>';
    }).join("");
    accountOverlay.querySelectorAll("[data-acct-pick]").forEach(function(b){
      b.addEventListener("click", function(){
        formAccount = b.getAttribute("data-acct-pick");
        fromAcctName.textContent = formAccount;
        accountOverlay.classList.remove("open");
      });
    });
    accountOverlay.classList.add("open");
  }
  document.getElementById("fromAcctBtn").addEventListener("click", openAccountPicker);
  document.getElementById("closeAccountBtn").addEventListener("click", function(){ accountOverlay.classList.remove("open"); });
  accountOverlay.addEventListener("click", function(ev){ if(ev.target===accountOverlay) accountOverlay.classList.remove("open"); });

  /* ---------- category picker ---------- */
  var categoryOverlay = document.getElementById("categoryOverlay");
  function openCategoryPicker(){
    document.getElementById("categoryList").innerHTML = catsFor(formType).map(function(c){
      return '<li><button class="picker-item" data-cat-pick="'+esc(c.name)+'"><span class="pi-ic" style="color:'+c.color+'">'+esc(c.icon)+'</span><span style="flex:1">'+esc(c.name)+'</span>' +
        (c.name===formCategory ? '<span class="pi-check">✓</span>' : '') + '</button></li>';
    }).join("");
    categoryOverlay.querySelectorAll("[data-cat-pick]").forEach(function(b){
      b.addEventListener("click", function(){
        formCategory = b.getAttribute("data-cat-pick");
        syncCategoryUI();
        categoryOverlay.classList.remove("open");
      });
    });
    categoryOverlay.classList.add("open");
  }
  catIconBtn.addEventListener("click", openCategoryPicker);
  document.getElementById("closeCategoryBtn").addEventListener("click", function(){ categoryOverlay.classList.remove("open"); });
  categoryOverlay.addEventListener("click", function(ev){ if(ev.target===categoryOverlay) categoryOverlay.classList.remove("open"); });
  document.getElementById("addCustomCatBtn").addEventListener("click", function(){
    var inp = document.getElementById("customCatInput");
    var name = inp.value.trim();
    if(!name) { inp.focus(); return; }
    if(!customCats[formType].some(function(n){ return n.toLowerCase()===name.toLowerCase(); }) &&
       !catsFor(formType).some(function(c){ return c.name.toLowerCase()===name.toLowerCase(); })){
      customCats[formType].push(name);
      persist();
    }
    formCategory = name;
    inp.value = "";
    syncCategoryUI();
    categoryOverlay.classList.remove("open");
    toast("Category added ✓");
  });

  /* ---------- pencil: name + opening balance ---------- */
  var profileOverlay = document.getElementById("profileOverlay");
  var profileNameInput = document.getElementById("profileNameInput");
  var openingInput = document.getElementById("openingInput");
  document.getElementById("editProfileBtn").addEventListener("click", function(){
    profileNameInput.value = profileName;
    openingInput.value = opening ? opening : "";
    profileOverlay.classList.add("open");
    setTimeout(function(){ profileNameInput.focus(); }, 60);
  });
  function closeProfile(){ profileOverlay.classList.remove("open"); }
  document.getElementById("closeProfileBtn").addEventListener("click", closeProfile);
  document.getElementById("cancelProfileBtn").addEventListener("click", closeProfile);
  profileOverlay.addEventListener("click", function(ev){ if(ev.target===profileOverlay) closeProfile(); });
  document.getElementById("saveProfileBtn").addEventListener("click", function(){
    profileName = profileNameInput.value.trim();
    var v = parseFloat(openingInput.value);
    opening = isNaN(v) ? 0 : Math.round(v*100)/100;
    persist(); closeProfile(); render(); toast("Saved ✓");
  });

  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape"){ closeSheet(); closeProfile(); accountOverlay.classList.remove("open"); categoryOverlay.classList.remove("open"); }
  });

  /* ---------- init ---------- */
  persist();
  render();
})();
</script>
</body>
</html>
